<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030303">
  <meta name="description" content="StrongerCity Trading Center — educação, ferramentas e informações sobre o mercado financeiro.">
  <title>{% block title %}StrongerCity Trading Center{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  {% block content %}{% endblock %}

  <footer class="site-footer container-wide">
    <div class="footer-brand"><span class="footer-mark" aria-hidden="true"></span><span>STRONGERCITY TRADING CENTER</span></div>
    <p>Conteúdo exclusivamente educacional. Operar no mercado financeiro envolve riscos.</p>
    <span>© 2019–2026</span>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
